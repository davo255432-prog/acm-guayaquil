name: Importar muestra verificada Napoli

on:
  workflow_dispatch:

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar cliente de Supabase
        run: pip install --no-cache-dir supabase

      - name: Importar anuncios verificados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper/importar_napoli_verificado.py
